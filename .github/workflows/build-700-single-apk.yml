name: Apple Music 7.0 单 APK 测试版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  single-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APK: AMPP-Lyrics-AppleMusic-7.0.0-beta-1606-arm64-test-r1.apk
      TAG: applemusic-7.0.0-beta-test-r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;37.0.0 platforms;android-37.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: 校验映射、测试并构建普通模块
        run: |
          set -euo pipefail
          python3 scripts/verify-profile-data.py
          python3 scripts/verify-glass-reference.py
          bash gradlew test :app:lintDebug :glass:lintDebug :glass-lab:lintDebug :app:assembleDebug :glass-lab:assembleDebug :glass-lab:assembleDebugAndroidTest --no-daemon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 下载固定原包与工具
        run: |
          set -euo pipefail
          mkdir -p inputs dist
          gh release download embedded-2026.08.10-r1 --repo Zennmn/AM-plus-plus --pattern '103-version-com.apple.android.music-npatched.apks' --dir inputs
          gh release download V1.4.9 --repo REAndroid/APKEditor --pattern 'APKEditor-1.4.9.jar' --dir inputs
          gh release download v1.0.7 --repo 7723mod/NPatch --pattern 'jar-v1.0.7-741-release.jar' --dir inputs
      - name: 生成单 APK 并核验原包、接口、资源、DEX、原生库及签名
        run: |
          set -euo pipefail
          python3 scripts/package-700-single-apk.py \
            inputs/103-version-com.apple.android.music-npatched.apks \
            app/build/outputs/apk/debug/app-debug.apk "dist/$APK" \
            --editor inputs/APKEditor-1.4.9.jar \
            --npatch inputs/jar-v1.0.7-741-release.jar \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: AppleMusic-700-single-apk-test-r1
          path: dist/*
          if-no-files-found: error
      - name: 发布独立预发布测试下载
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isPrerelease --jq .isPrerelease > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = true
            gh release view "$TAG" --json assets --jq .assets > existing-assets.json
            for file in dist/*; do
              name=$(basename "$file")
              digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              if jq -e --arg name "$name" 'any(.[]; .name == $name)' existing-assets.json >/dev/null; then
                test "$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' existing-assets.json)" = "$digest"
              else
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Apple Music 7.0.0-beta / 1606 · 普通单 APK 测试 r1' \
              --notes-file docs/release-700-single-test.md
          fi
