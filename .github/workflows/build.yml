name: Verify AMPP Lyrics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify source and exact host profiles
        run: |
          python3 scripts/verify-architecture.py
          python3 scripts/verify-profile-data.py
          python3 scripts/verify-glass-reference.py
          python3 -m unittest discover -s scripts/tests
      - name: Test and build ordinary module
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :app:assembleDebug --no-daemon --max-workers=2
          mkdir -p build/verified-modules
          cp app/build/outputs/apk/debug/app-debug.apk build/verified-modules/ordinary.apk
          python3 scripts/verify-integrated-lyrics.py build/verified-modules/ordinary.apk
      - name: Test and build coexist module
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PamppCoexistence=true --no-daemon --max-workers=2
          cp app/build/outputs/apk/debug/app-debug.apk build/verified-modules/coexist.apk
          python3 scripts/verify-integrated-lyrics.py build/verified-modules/coexist.apk
      - uses: actions/upload-artifact@v4
        with:
          name: verification-modules-not-music-installers
          path: build/verified-modules
          if-no-files-found: error
