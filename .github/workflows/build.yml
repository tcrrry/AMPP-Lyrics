name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      save_artifacts:
        description: Save temporary APK artifacts for one day
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned glass renderer
        run: python3 scripts/verify-glass-reference.py

      - name: Build and test standalone module
        run: |
          chmod +x gradlew
          ./gradlew test :app:lintDebug :glass:lintDebug :glass-lab:lintDebug :app:assembleDebug :glass-lab:assembleDebug :glass-lab:assembleDebugAndroidTest --no-daemon

      - name: Report unit-test results
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import pathlib, xml.etree.ElementTree as ET
          for module in ('app', 'glass'):
              suites = [ET.parse(p).getroot() for p in pathlib.Path(module, 'build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
              if not suites:
                  continue
              counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
              print(f'::notice title={module} unit-test results::{counts}')
              for suite in suites:
                  for case in suite.findall('testcase'):
                      for kind in ('failure', 'error'):
                          result = case.find(kind)
                          if result is not None:
                              title = case.get('classname', '') + '.' + case.get('name', '')
                              message = (result.text or result.get('message', ''))[:6000]
                              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                              print(f'::error title={title}::{message}')
          for report in pathlib.Path('.').glob('*/build/reports/lint-results-debug.xml'):
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      message = issue.get('message', '').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      location = issue.find('location')
                      path = location.get('file', '') if location is not None else ''
                      line = location.get('line', '1') if location is not None else '1'
                      print(f"::error file={path},line={line},title={issue.get('id')}::{message}")
          PYREPORT

      - name: Upload standalone module APK
        if: github.event_name == 'workflow_dispatch' && inputs.save_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-Desktop-Lyrics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload glass comparison APKs
        if: github.event_name == 'workflow_dispatch' && inputs.save_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-glass-lab
          path: |
            glass-lab/build/outputs/apk/debug/glass-lab-debug.apk
            glass-lab/build/outputs/apk/androidTest/debug/glass-lab-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
