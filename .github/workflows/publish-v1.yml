name: 发布静态校验的 v1.1 三种安装包

on:
  workflow_dispatch:
    inputs:
      apks_source:
        description: 已验证 APKS 的临时下载地址
        required: true
        type: string
      apk_source:
        description: 静态校验的试验版单 APK 临时下载地址
        required: true
        type: string
      module_source:
        description: 已验证模块 APK 的临时下载地址
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APKS: AMPP-Lyrics-AppleMusic-6.5.3-arm64.apks
      APK: AMPP-Lyrics-AppleMusic-6.5.3-arm64.apk
      MODULE: AMPP-Lyrics-module.apk
    steps:
      - name: 下载已验证的安装包
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDOWNLOAD'
          import json, os, pathlib, subprocess, urllib.parse
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pathlib.Path('dist').mkdir()
          for key, filename in [('apks_source', os.environ['APKS']), ('apk_source', os.environ['APK']), ('module_source', os.environ['MODULE'])]:
              url = event['inputs'][key]
              parsed = urllib.parse.urlparse(url)
              assert parsed.scheme == 'https' and parsed.hostname == 'release-assets.githubusercontent.com'
              print('::add-mask::' + url, flush=True)
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3', '--max-time', '600', url, '-o', 'dist/' + filename], check=True)
          PYDOWNLOAD

      - name: 校验正式文件内容
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          echo "e08466d26ba06c55b8f491a52e4c7bd383602f68cb3ce06af1182c0167123f10  $APKS" > "$APKS.sha256"
          echo "e14317e4faedd01a9131ff4258a2f0291e8d69a30fa22278962da027e6107873  $MODULE" > "$MODULE.sha256"
          echo "309062ad1c1987160e493277a396ab784b1c052e6bf96c68b8ba92a5188a5781  $APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"
          sha256sum -c "$APKS.sha256"
          sha256sum -c "$MODULE.sha256"
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['APKS']) as z:
              assert z.namelist() == ['base.apk', 'split_config.arm64_v8a.apk', 'split_config.xxxhdpi.apk']
              assert z.testzip() is None
          print('APKS 分包与压缩包完整性校验通过。')
          PY

      - name: 上传附件并公开正式发布
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v1.1") | .id')
          test -n "$release_id"
          gh api "repos/$GH_REPO/releases/$release_id" --jq .assets > existing-assets.json
          for file in dist/*; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' existing-assets.json >/dev/null; then
              test "$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' existing-assets.json)" = "$digest"
            else
              gh release upload v1.1 "$file"
            fi
          done
          gh release edit v1.1 --draft=false --prerelease=false --latest
