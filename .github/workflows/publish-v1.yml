name: 发布已验证的 v1 安装包

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APKS: AMPP-Lyrics-v1-AppleMusic-6.5.3-arm64.apks
      MODULE: AMPP-Lyrics-v1-module.apk
    steps:
      - name: 下载已验证的安装包
        env:
          APKS_SOURCE: ${{ secrets.V1_APKS_SOURCE_URL }}
          MODULE_SOURCE: ${{ secrets.V1_MODULE_SOURCE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APKS_SOURCE"
          test -n "$MODULE_SOURCE"
          mkdir dist
          curl --fail --silent --show-error --location --retry 3 --max-time 600 "$APKS_SOURCE" -o "dist/$APKS"
          curl --fail --silent --show-error --location --retry 3 --max-time 600 "$MODULE_SOURCE" -o "dist/$MODULE"

      - name: 校验正式文件内容
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          echo "ab6f2b92305c8e80e4bd21a645288586c8df28788d10404e9e0c2a48776c7ce7  $APKS" > "$APKS.sha256"
          echo "7545db9bb7cd1649d87f00fbc39a1cd297730f710e5e5cc5584fa681f9c5f81e  $MODULE" > "$MODULE.sha256"
          sha256sum -c "$APKS.sha256"
          sha256sum -c "$MODULE.sha256"
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['APKS']) as z:
              assert z.namelist() == ['base.apk', 'split_config.arm64_v8a.apk', 'split_config.xxxhdpi.apk']
              assert z.testzip() is None
          print('APKS 分包与压缩包完整性校验通过。')
          PY

      - name: 上传附件并公开正式发布
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v1") | .id')
          test -n "$release_id"
          gh api "repos/$GH_REPO/releases/$release_id" --jq .assets > existing-assets.json
          for file in dist/*; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' existing-assets.json >/dev/null; then
              test "$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' existing-assets.json)" = "$digest"
            else
              gh release upload v1 "$file"
            fi
          done
          gh release edit v1 --draft=false --prerelease=false --latest
